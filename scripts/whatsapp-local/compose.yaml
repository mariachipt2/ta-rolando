name: ta-rolando-whatsapp
services:
  api:
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    restart: unless-stopped
    ports: ["127.0.0.1:8188:8080"]
    env_file: [.env]
    environment:
      SERVER_URL: http://127.0.0.1:8188
      SERVER_PORT: 8080
      CORS_ORIGIN: http://127.0.0.1:8190,http://localhost:8190
      CORS_CREDENTIALS: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      DATABASE_SAVE_IS_ON_WHATSAPP: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: tarolando
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      TELEMETRY_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      DEL_INSTANCE: 'false'
      WEBHOOK_GLOBAL_ENABLED: 'false'
      WEBSOCKET_ENABLED: 'false'
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      CONFIG_SESSION_PHONE_CLIENT: Ta Rolando
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [instances:/evolution/instances]
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [cache:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  instances:
  database:
  cache:
